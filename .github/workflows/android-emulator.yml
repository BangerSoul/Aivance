name: Android Emulator & Instrumented Tests

# Replaces the previous "Docker Emulator & Web Browser RDP Testing" workflow,
# which never produced a green run. It booted a `budtmo/docker-android:emulator_11.0`
# container and then waited in an unbounded `until adb shell getprop sys.boot_completed`
# loop: if the container never came up (or came up without KVM), the loop spun until
# the job hit its own 45-minute timeout. That produced 13 consecutive non-green runs
# across every branch, which made an unrelated emulator outage look like a repo-wide
# regression. `reactivecircus/android-emulator-runner` boots the emulator directly on
# the runner, fails with real diagnostics instead of hanging, and needs no container.

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Emulator API level'
        type: string
        default: '35'

env:
  JAVA_VERSION: "17"

concurrency:
  group: android-emulator-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Category: Instrumented (androidTest) coverage ────────────────────────────
  emulator-instrumented-tests:
    name: 🤖 Emulator & Instrumented Tests
    runs-on: ubuntu-latest
    # Boot + R8 + the full connectedAndroidTest sweep. The release-variant app
    # under test adds ~6 min of minification and runs slower shrunk than debug
    # did, so this is comfortably more headroom than the debug-only run needed.
    # (The previous 45 was only ever reached by the boot hang described above.)
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Fail fast and legibly when the runner has no nested virtualisation.
      # Without this the symptom is a 35-minute timeout with no explanation.
      - name: Verify KVM acceleration is available
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not present on this runner — hardware-accelerated" \
                 "emulation is unavailable, so instrumented tests cannot run." \
                 "GitHub-hosted Linux runners expose KVM; a self-hosted or larger" \
                 "runner may not."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --subsystem-match=misc
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # `testBuildType = "release"` (app/build.gradle.kts) means the app under
      # test and its androidTest APK are both release builds. Android refuses to
      # instrument a non-debuggable target unless both APKs carry the *same*
      # signature, so a keystore has to exist before the run starts — an
      # unsigned release APK cannot be installed at all.
      #
      # The real repository secrets are used whenever they are present. Until the
      # owner adds them, a throwaway key is generated per run: it lives for one
      # job, signs nothing that leaves the runner, and is replaced automatically
      # the moment the real secrets land. The hardcoded password below is not a
      # leak — a key that is regenerated every run and never published has
      # nothing to protect, and inventing a "real" CI secret here would be the
      # actual risk.
      - name: Provision a release signing key for the instrumented run
        env:
          STORE_BASE64: ${{ secrets.AIVANCE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AIVANCE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AIVANCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AIVANCE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A partial secret set is treated as absent on purpose — app/build.gradle.kts
          # refuses to apply a half-configured signing config, so falling back here
          # keeps that invariant — but it must not fail *silently*. Someone who added
          # three of the four and saw a green run would reasonably assume CI was
          # signing with their real key.
          present=0
          for v in "$STORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -n "$v" ] && present=$((present + 1))
          done
          if [ "$present" -ne 0 ] && [ "$present" -ne 4 ]; then
            echo "::warning::Only $present of 4 release signing secrets are set."
            echo "::warning::Falling back to a throwaway key, so this run is NOT"
            echo "::warning::signed with the repository keystore. Set all four of"
            echo "::warning::AIVANCE_KEYSTORE_BASE64 / _STORE_PASSWORD / _KEY_ALIAS /"
            echo "::warning::_KEY_PASSWORD to use the real one."
          fi
          if [ "$present" -eq 4 ]; then
            echo "Using the repository release keystore from secrets."
            printf '%s' "$STORE_BASE64" | base64 --decode > keystore.jks
            store_pass="$STORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_pass="$KEY_PASSWORD"
          else
            echo "::notice::Release signing secrets are not configured yet —"
            echo "::notice::generating a throwaway key valid for this run only."
            echo "::notice::It signs nothing published and cannot build a Play"
            echo "::notice::artifact, so R8/runtime coverage is unaffected."
            store_pass=aivance-ci
            key_alias=aivance-ci
            key_pass=aivance-ci
            keytool -genkeypair -v -keystore keystore.jks -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 2 -alias "$key_alias" \
              -storepass "$store_pass" -keypass "$key_pass" \
              -dname "CN=Aivance CI, OU=CI, O=Aivance, C=US"
          fi
          # Catches a truncated keystore or a wrong alias here, instead of
          # surfacing as an opaque AGP install failure much later.
          keytool -list -keystore keystore.jks -storepass "$store_pass" \
            -alias "$key_alias" > /dev/null
          {
            echo "AIVANCE_STORE_FILE=$PWD/keystore.jks"
            echo "AIVANCE_STORE_PASSWORD=$store_pass"
            echo "AIVANCE_KEY_ALIAS=$key_alias"
            echo "AIVANCE_KEY_PASSWORD=$key_pass"
          } >> "$GITHUB_ENV"

      # `api_level` is a workflow_dispatch input; for push/pull_request events
      # github.event.inputs is empty, so the expression falls back to 35.
      #
      # Deliberately no `profile:` input. That input is passed straight to
      # `avdmanager create avd --device <profile>`, which takes a *hardware
      # device* id (`Nexus 6`, `pixel_6`, ...) — not an image tag. Passing
      # `google_apis` there aborted the very first attempt with
      # "No device found matching --device google_apis"; the emulator never
      # started, and the action's own `emu kill` teardown then failed too,
      # burying the real message. Leaving it unset omits `--device` entirely
      # and lets avdmanager pick its default hardware profile.
      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '35' }}
          target: google_apis
          arch: x86_64
          # Room DAO + migration suites are the heaviest instrumented tests here.
          ram-size: 4096M
          # The app ships per-ABI splits, so the x86_64 slice is the one the
          # emulator can install. Disable them for the connected run to avoid
          # the universal-APK/split mismatch the old Docker job hit.
          # `useRegisteredAppId` is no longer passed: it only ever affected the
          # *debug* buildType's `applicationIdSuffix`, and `:app` now tests the
          # release variant, whose application id is `com.bangersoul.aivance`
          # with no suffix at all. ExampleInstrumentedTest asserts exactly that,
          # so the release run is the better-behaved one — it also happens to be
          # the id registered in google-services.json and in Play Console.
          #
          # Only `:app` moves to the release variant. Library modules keep their
          # debug androidTest tasks, and that is deliberate rather than an
          # oversight: R8 only ever runs in the application module, so a
          # library's "release" variant is not shrunk and switching it would buy
          # no extra minification coverage while adding a second failure mode.
          # The `:app` release run is what matters — it minifies and executes
          # the app *and* every library's code in one shrunken process, which is
          # exactly the surface where a stripped serializer or Hilt component
          # would surface.
          #
          # The task list is explicit rather than a bare `connectedDebugAndroidTest`.
          # AGP registers that task for *every* Android module, and the ~20
          # library modules with no `src/androidTest` still build and install a
          # test APK. With no `androidx.test:runner` on their classpath they
          # cannot even start, so each one failed with
          # `ClassNotFoundException: androidx.test.runner.AndroidJUnitRunner`
          # — noise that buried the four modules that actually have tests.
          # Keep this list in sync when a module gains an `androidTest` source
          # set: `find . -type d -name androidTest -not -path '*/build/*'`.
          #
          # `:macrobenchmark` is deliberately excluded. It holds no
          # `src/androidTest`, and its StartupBenchmark refuses to run on an
          # emulator by design ("ERROR: Running on Emulator", plus
          # "Benchmark Target is Debuggable"); macrobenchmarks are only
          # meaningful on a physical, non-debuggable target.
          #
          # There is deliberately no manual `adb install` / `am start` here. The
          # previous script installed `app-universal-debug.apk`, a filename that
          # does not exist (the ABI split block sets `isUniversalApk = false`),
          # and `am start` exits 0 even when the app dies immediately after, so
          # it could only ever produce false confidence.
          # `connectedReleaseAndroidTest` builds, installs and launches the app
          # itself, and a Hilt/Compose/Room init crash fails the instrumentation
          # rather than passing quietly. Against the release variant that
          # includes everything R8 did to the bytecode first.
          #
          # The keystore comes from the step above. `--continue` is kept so a
          # failure in one module still reports the other four instead of
          # stopping at the first.
          #
          # `--max-workers=2` because the 4 GB emulator is already resident when
          # Gradle starts, and `gradle.properties` sets both `parallel=true` and
          # `-Xmx4096m`. Each extra worker forks another JVM for D8/dexing, and
          # under that pressure `:navigation:packageDebugAndroidTest` died with
          # a bare `PackageAndroidArtifact$IncrementalSplitterRunnable` and no
          # message at all. Bounding the workers is cheaper than shrinking the
          # emulator. `--stacktrace` is there because that failure printed
          # nothing useful: without it the next occurrence is just as opaque.
          #
          # Each `script` line runs as its own `sh -c`, so no `\`
          # line continuations here — they would be split into broken fragments.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew :app:connectedReleaseAndroidTest :core:data:connectedDebugAndroidTest :core:database:connectedDebugAndroidTest :feature:dashboard:connectedDebugAndroidTest :navigation:connectedDebugAndroidTest -Paivance.disableAbiSplits=true --no-daemon --continue --max-workers=2 --stacktrace

      # The emulator action's teardown step (`adb … emu kill`) also fails when
      # the emulator never came up, and it is the last line in the log. That
      # buries the actual cause, so re-print the AVD/emulator state on failure.
      - name: Collect emulator diagnostics
        if: failure()
        run: |
          echo "=== AVD definitions ==="
          avdmanager list avd || true
          echo "=== adb devices ==="
          adb devices -l || true
          echo "=== emulator process ==="
          ps -ef | grep -i "[e]mulator" || echo "(no emulator process)"
          echo "=== system images installed ==="
          sdkmanager --list_installed 2>/dev/null | grep -i "system-images" || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14

      # Interactive debugging is opt-in and only offered on manual runs, so it
      # never blocks a PR. The old workflow's tmate step was gated the same way
      # but only ever ran after a boot that never completed, so it was dead code.
      - name: Open an interactive shell
        if: github.event_name == 'workflow_dispatch'
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
