name: Aivance CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Nightly full test suite run at 06:00 UTC Monday-Friday
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (alpha, beta, rc, stable)'
        required: false
        default: 'alpha'
      run_benchmarks:
        description: 'Run performance benchmarks'
        type: boolean
        default: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
  GRADLE_BUILD_CACHE_ENABLED: true
  JAVA_VERSION: "17"

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Category 1: Security Verification Gate ────────────────
  security-scan:
    name: 🔒 1. Security & Certificate Pinning Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Python verification dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages cryptography

      - name: Run security verification harness
        run: python3 security_scan.py

  # ── Category 2: Categorized Compilation Check ─────────────
  compilation:
    name: ⚙️ 2. Categorized Compilation Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Compile All Modules
        run: ./gradlew compileDebugKotlin --no-daemon --parallel

  # ── Category 3: Categorized Unit Test Suite ──────────────
  unit-tests:
    # Quoted: an unquoted scalar containing ": " is parsed as a nested mapping,
    # which made this workflow file invalid YAML and stopped the entire
    # workflow from scheduling a single job.
    name: "🧪 3. Unit Tests (${{ matrix.category }}: ${{ matrix.module }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Core Architecture Modules
          - category: 'Core'
            module: ':core:common'
          - category: 'Core'
            module: ':core:database'
          - category: 'Core'
            module: ':core:datastore'
          - category: 'Core'
            module: ':core:designsystem'
          - category: 'Core'
            module: ':core:network'
          - category: 'Core'
            module: ':core:util'
          - category: 'Core'
            module: ':core:domain'
          - category: 'Core'
            module: ':core:data'

          # Provider Integration Engines
          - category: 'Providers'
            module: ':core:sdk'
          - category: 'Providers'
            module: ':core:ai-providers'
          - category: 'Providers'
            module: ':core:job-providers'
          - category: 'Providers'
            module: ':core:enrichment-providers'

          # Feature Modules
          - category: 'Feature'
            module: ':feature:analytics'
          - category: 'Feature'
            module: ':feature:assistant'
          - category: 'Feature'
            module: ':feature:ats'
          - category: 'Feature'
            module: ':feature:coverletter'
          - category: 'Feature'
            module: ':feature:dashboard'
          - category: 'Feature'
            module: ':feature:interview'
          - category: 'Feature'
            module: ':feature:jobs'
          - category: 'Feature'
            module: ':feature:profile'
          - category: 'Feature'
            module: ':feature:recruiter'
          - category: 'Feature'
            module: ':feature:resume'
          - category: 'Feature'
            module: ':feature:tracker'

          # Navigation & App Shell
          - category: 'AppShell'
            module: ':navigation'
          - category: 'AppShell'
            module: ':app'

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run unit tests for ${{ matrix.module }}
        run: |
          # `:app` sets `testBuildType = "release"` (app/build.gradle.kts) so its
          # androidTest runs against the minified build. That retargets the JVM unit
          # test variant too, so the task is `testReleaseUnitTest` there and does not
          # exist as `testDebugUnitTest` any more — asking for it fails with
          # "Cannot locate tasks that match ':app:testDebugUnitTest'". Every library
          # module still uses the default test build type and keeps the debug task.
          if [ "${{ matrix.module }}" = ":app" ]; then
            TASK=testReleaseUnitTest
          else
            TASK=testDebugUnitTest
          fi
          ./gradlew ${{ matrix.module }}:$TASK --no-daemon --continue

      - name: Sanitize module name for artifact
        id: sanitize
        run: echo "name=${{ matrix.module }}" | sed 's/:/_/g' | sed 's/^_//' >> $GITHUB_OUTPUT

      - name: Upload test results for ${{ matrix.module }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ steps.sanitize.outputs.name }}
          path: |
            ${{ matrix.module }}/build/reports/tests/
            ${{ matrix.module }}/build/test-results/
          retention-days: 7

  # ── Category 4: Android Lint & Quality Gate ───────────────
  code-quality:
    name: 🧹 4. Code Quality & Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Android Lint across all modules
        run: ./gradlew lint --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.sarif
          retention-days: 14

  # ── Category 5: APK & Bundle Build Gate ───────────────────
  build-artifacts:
    name: 📦 5. Categorized APK & Bundle Build
    needs: [security-scan, compilation, unit-tests, code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APKs (per-ABI splits)
        run: ./gradlew :app:assembleDebug --no-daemon

      # Every release build in this repository is gated on the release signing
      # secrets being present. When they are not, the release steps below are
      # skipped — which is why R8/minify had never been compiled anywhere until
      # this step was added. An unsigned `assembleRelease` needs no secrets and
      # catches R8 rule regressions, missing classes and resource-shrinker
      # failures on every PR instead of on release day.
      - name: Compile Release Variant (R8 gate, unsigned)
        run: ./gradlew :app:assembleRelease -Paivance.disableAbiSplits=true --no-daemon

      - name: Check Keystore Configuration
        id: check-keystore
        run: |
          if [ -n "${{ secrets.AIVANCE_KEYSTORE_BASE64 }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "${{ secrets.AIVANCE_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::AIVANCE_KEYSTORE_BASE64 is not set — the signed release" \
                 "APK/AAB steps are skipped and only the unsigned R8 gate runs."
          fi

      # Splits and a bundle cannot coexist in one build (AGP issue 402800800),
      # so the signed per-ABI APKs and the Play AAB are built separately.
      # `aivance.requireSigning` makes a misconfigured keystore a hard failure
      # rather than a silently unsigned artifact.
      - name: Build Signed Release APKs (per-ABI splits)
        if: steps.check-keystore.outputs.exists == 'true'
        run: ./gradlew :app:assembleRelease -Paivance.requireSigning=true --no-daemon
        env:
          AIVANCE_STORE_FILE: keystore.jks
          AIVANCE_STORE_PASSWORD: ${{ secrets.AIVANCE_STORE_PASSWORD }}
          AIVANCE_KEY_ALIAS: ${{ secrets.AIVANCE_KEY_ALIAS }}
          AIVANCE_KEY_PASSWORD: ${{ secrets.AIVANCE_KEY_PASSWORD }}

      - name: Build Signed Release AAB
        if: steps.check-keystore.outputs.exists == 'true'
        run: ./gradlew :app:bundleRelease -Paivance.disableAbiSplits=true -Paivance.requireSigning=true --no-daemon
        env:
          AIVANCE_STORE_FILE: keystore.jks
          AIVANCE_STORE_PASSWORD: ${{ secrets.AIVANCE_STORE_PASSWORD }}
          AIVANCE_KEY_ALIAS: ${{ secrets.AIVANCE_KEY_ALIAS }}
          AIVANCE_KEY_PASSWORD: ${{ secrets.AIVANCE_KEY_PASSWORD }}

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aivance-debug-apks
          path: app/build/outputs/apk/debug/*-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v7
        if: steps.check-keystore.outputs.exists == 'true'
        with:
          name: aivance-release-apks
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 90

      - name: Upload Release AAB Bundle
        uses: actions/upload-artifact@v7
        if: steps.check-keystore.outputs.exists == 'true'
        with:
          name: aivance-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload Release R8 Mapping File
        uses: actions/upload-artifact@v7
        if: steps.check-keystore.outputs.exists == 'true'
        with:
          name: aivance-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
