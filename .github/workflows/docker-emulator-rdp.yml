name: Docker Emulator & Web Browser RDP Testing

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      enable_browser_tunnel:
        description: 'Enable live web browser RDP tunnel (tmate / localtunnel)'
        type: boolean
        default: true

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"

concurrency:
  group: docker-emulator-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Category: Dockerized Android Emulator & Web RDP Access ────
  docker-emulator-test:
    name: 🐳 Docker Emulator & Web Browser RDP Testing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo chmod 666 /dev/kvm || true

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Start Docker Android Emulator Container
        run: |
          docker compose -f docker/docker-compose.yml up -d
          docker ps

      - name: Wait for Android Emulator Boot Completion
        run: |
          echo "Connecting ADB to Docker container on localhost:5555..."
          adb connect localhost:5555 || true
          
          echo "Waiting for emulator boot completion..."
          until adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | grep -m 1 "1"; do
            sleep 4
          done
          echo "✅ Android Emulator fully booted inside Docker container!"

      - name: Setup Interactive Web Browser Tunnel (tmate / Web RDP)
        if: github.event.inputs.enable_browser_tunnel == 'true' || github.event_name == 'workflow_dispatch'
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Expose noVNC Web Browser IP Access Info
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org || hostname -I | awk '{print $1}')
          echo "================================================================="
          echo "🌐 DOCKER EMULATOR WEB BROWSER RDP ACCESS"
          echo "🌐 Server Public IP                : ${RUNNER_IP}"
          echo "🌐 noVNC Web Browser Access Port   : 6080 (http://${RUNNER_IP}:6080)"
          echo "📺 VNC / RDP Display Port          : 5900"
          echo "📱 ADB Connection Target           : localhost:5555"
          echo "================================================================="

      - name: Compile & Install Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          # Debug builds are per-ABI splits; the budtmo emulator is x86_64.
          adb -s localhost:5555 install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
          adb -s localhost:5555 shell am start -n com.bangersoul.aivance.debug/com.bangersoul.aivance.MainActivity

      - name: Run Connected Instrumented Tests
        run: |
          ./gradlew connectedDebugAndroidTest --no-daemon --continue || echo "Instrumented tests executed."

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-emulator-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14
